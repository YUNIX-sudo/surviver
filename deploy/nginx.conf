# /etc/nginx/sites-available/surviver.yunix.software
# Surviver game: Node.js container on 127.0.0.1:8085 (HTTP static + REST + WebSocket /ws).
# On this host nginx.conf does NOT include sites-enabled/ (all vhosts are inline), so
# deploy/setup-nginx.sh adds a single `include` line for this file into the http {} block.
# Certificate: certbot certonly --nginx -d surviver.yunix.software (auto-renew by certbot timer).

upstream surviver_app {
    server 127.0.0.1:8085;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name surviver.yunix.software;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name surviver.yunix.software;

    ssl_certificate     /etc/letsencrypt/live/surviver.yunix.software/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surviver.yunix.software/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # WebSocket endpoint: HTTP/1.1 Upgrade must be forwarded explicitly
    location /ws {
        proxy_pass http://surviver_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://surviver_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
