<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>Surviver — админка</title>
  </head>
  <body class="admin">
    <header class="adm-head"><b class="logo">SURVIVER</b> <span class="muted">админ-панель</span><span style="flex:1"></span><span id="adm-status" class="muted"></span><button class="btn small" id="adm-logout" hidden>Выйти</button></header>
    <main id="adm-main">
      <div class="modal-card" id="adm-login" style="margin:60px auto">
        <h2>Вход администратора</h2>
        <p class="muted small">ADMIN_TOKEN из переменных окружения сервера (или из лога запуска).</p>
        <form id="adm-form" class="row"><input id="adm-token" type="password" placeholder="ADMIN_TOKEN" style="flex:1" /><button class="btn primary">Войти</button></form>
        <div class="error" id="adm-err"></div>
      </div>
      <div id="adm-app" hidden>
        <section class="adm-grid" id="adm-server"></section>
        <section><h2>Комнаты</h2><div id="adm-rooms" class="adm-cards"></div></section>
        <section><h2>Подключения</h2><table class="stats" id="adm-sessions"></table></section>
        <section class="adm-two">
          <div><h2>Журнал античита</h2><div class="adm-counts" id="adm-counts"></div><div class="log" id="adm-violations"></div></div>
          <div>
            <h2>Объявление</h2>
            <form id="adm-bc" class="row"><input id="adm-bc-text" maxlength="200" placeholder="Сообщение всем игрокам" style="flex:1" /><button class="btn">Отправить</button></form>
            <h2>Аккаунты</h2><table class="stats" id="adm-accounts"></table>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
