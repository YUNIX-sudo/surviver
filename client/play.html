<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>Surviver — игра</title>
  </head>
  <body class="game-page">
    <div id="canvas-wrap"></div>
    <div id="overlay"></div>
    <div id="vignette"></div>

    <div id="hud" hidden>
      <div class="hud-tl panel">
        <div class="bar-row"><span class="lbl">Ядро</span><div class="bar core"><i id="core-fill"></i><b id="core-text"></b></div></div>
        <div class="bar-row"><span class="lbl">HP</span><div class="bar hp"><i id="hp-fill"></i><b id="hp-text"></b></div></div>
        <div class="room-line"><span id="room-name"></span> · <span id="player-count"></span></div>
      </div>

      <div class="hud-tc panel" id="phase-box">
        <div id="phase-title">ПОДГОТОВКА</div>
        <div id="phase-timer">10:00</div>
        <div id="phase-sub"></div>
      </div>

      <div class="hud-tr">
        <canvas id="minimap" width="180" height="180"></canvas>
        <div class="panel net-mini">
          <span>Пинг <b id="mini-ping">–</b></span>
          <span>FPS <b id="mini-fps">–</b></span>
          <span>Потери <b id="mini-loss">0</b></span>
        </div>
        <button id="panel-btn" class="btn small">📡 Сеть и античит <kbd>F2</kbd></button>
      </div>

      <div class="hud-bc">
        <div class="panel inv-row">
          <div class="inv"><span class="ico wood"></span><b id="inv-wood">0</b><small id="map-wood"></small></div>
          <div class="inv"><span class="ico stone"></span><b id="inv-stone">0</b><small id="map-stone"></small></div>
          <div class="inv"><span class="ico iron"></span><b id="inv-iron">0</b><small id="map-iron"></small></div>
        </div>
        <div id="hotbar"></div>
        <button id="ready-btn" class="btn">Готов <kbd>R</kbd></button>
      </div>

      <div class="hud-bl panel" id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" maxlength="120" placeholder="Enter — чат" autocomplete="off" />
      </div>

      <div id="help" class="panel">
        <b>WASD</b> движение · <b>ЛКМ/Space</b> добыча/атака · <b>1-3</b> постройка · <b>ПКМ/Q</b> отмена · <b>R</b> готов · <b>колесо</b> зум
      </div>
      <div id="toasts"></div>
      <div id="hint"></div>
      <div id="dead-msg" hidden>Вы погибли — респавн…</div>
    </div>

    <aside id="netpanel" class="drawer"></aside>

    <div id="lobby" class="modal">
      <div class="modal-card">
        <h1>SURVIVER</h1>
        <p class="muted">Кооперативное выживание против орды. Комната на 1–4 игроков.</p>
        <div id="lobby-account"></div>
        <label class="field" id="guest-field">Имя гостя<input id="guest-name" maxlength="16" placeholder="Игрок" /></label>
        <div class="row">
          <button id="quick-join" class="btn primary">Быстрая игра</button>
          <input id="room-input" maxlength="24" placeholder="название-комнаты" />
          <button id="join-room" class="btn">Войти / создать</button>
        </div>
        <h3>Комнаты</h3>
        <div id="room-list" class="room-list"><span class="muted">загрузка…</span></div>
        <div class="row muted small"><a id="site-link" href="/">← На сайт</a><span id="server-line"></span></div>
        <div id="lobby-error" class="error"></div>
      </div>
    </div>

    <div id="gameover" class="modal" hidden><div class="modal-card" id="gameover-card"></div></div>
    <div id="disconnected" class="modal" hidden>
      <div class="modal-card">
        <h2>Соединение потеряно</h2>
        <p id="disc-reason" class="muted"></p>
        <button class="btn primary" onclick="location.reload()">Переподключиться</button>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
